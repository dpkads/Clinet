<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Jai Club Official | Premium Signals Group</title>
  
  <!-- Google Fonts + Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* FULL BLEED — RADICALLY DIFFERENT: EMERALD FOREST / GOLD ACCENTS */
    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(ellipse at 30% 40%, #0a2a1f, #021007);
      font-family: 'Inter', 'Poppins', sans-serif;
      color: #f0fdf4;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 0;
      margin: 0;
      position: relative;
    }

    /* Organic noise texture + glowing emerald aura */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 70% 20%, rgba(50, 255, 150, 0.08), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(45deg, rgba(80, 255, 140, 0.02) 0px, rgba(80, 255, 140, 0.02) 2px, transparent 2px, transparent 8px);
      pointer-events: none;
      z-index: 0;
    }

    /* MAIN CONTAINER — LUXURY GLASS, BOLD BORDERS, GOLD/EMERALD VIBE */
    .container {
      width: 100%;
      max-width: 100%;
      background: rgba(8, 20, 14, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 1.8rem 1.5rem 2.2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 2;
      border: 1px solid rgba(70, 255, 150, 0.35);
      margin: 1rem;
      width: calc(100% - 2rem);
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Interactive glowing cursor layer (emerald spark) */
    .container {
      --x-pos: 50%;
      --y-pos: 50%;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at var(--x-pos, 50%) var(--y-pos, 50%), rgba(46, 230, 120, 0.2), transparent 75%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: -1;
      border-radius: inherit;
    }

    .container:hover::before {
      opacity: 1;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #F9F3C1, #C8FFA0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* LOGO + PULSE RINGS — GOLDEN/EMERALD TWIST */
    .logo-live-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0.8rem 0 1rem 0;
      position: relative;
    }

    .logo-ring-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, #D4AF37, #2C7A47);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      box-shadow: 0 20px 35px -8px rgba(0, 255, 150, 0.5), 0 0 0 3px rgba(212, 175, 55, 0.4);
      transition: transform 0.2s ease;
      position: relative;
      z-index: 10;
    }

    .logo:active {
      transform: scale(0.97);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #10261b;
    }

    /* Rings — new energetic golden-emerald ripple effect */
    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(212, 175, 55, 0.8);
      box-shadow: 0 0 14px rgba(46, 255, 130, 0.6);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: emeraldPulse 2.4s infinite cubic-bezier(0.2, 0.9, 0.4, 1.1);
      opacity: 0;
      z-index: 1;
    }

    .ring-1 {
      width: 150px;
      height: 150px;
      border-width: 2.2px;
      animation-delay: 0s;
      border-color: #e5c45e;
    }
    .ring-2 {
      width: 172px;
      height: 172px;
      border-width: 2px;
      animation-delay: 0.45s;
      border-color: #b9f06e;
    }
    .ring-3 {
      width: 194px;
      height: 194px;
      border-width: 1.8px;
      animation-delay: 0.9s;
      border-color: #7cda5a;
    }
    .ring-4 {
      width: 216px;
      height: 216px;
      border-width: 1.5px;
      animation-delay: 1.35s;
      border-color: #c9f227;
    }
    .ring-5 {
      width: 238px;
      height: 238px;
      border-width: 1.2px;
      animation-delay: 1.8s;
      border-color: #ffdf6c;
    }

    @keyframes emeraldPulse {
      0% {
        opacity: 0.7;
        transform: translate(-50%, -50%) scale(0.92);
      }
      50% {
        opacity: 0.55;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5);
      }
    }

    /* BADGE — FRESH GOLD/EMERALD */
    .tag {
      background: rgba(30, 55, 38, 0.7);
      backdrop-filter: blur(5px);
      padding: 0.5rem 1.4rem;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.7px;
      border: 1px solid rgba(212, 175, 55, 0.7);
      color: #FFF5CF;
      margin-bottom: 1.4rem;
      text-transform: uppercase;
    }

    .live-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #9effb2;
      border-radius: 50%;
      box-shadow: 0 0 10px #6eff8e;
      animation: emeraldPulseDot 1.1s infinite alternate;
      margin-right: 6px;
    }

    @keyframes emeraldPulseDot {
      0% { opacity: 0.5; transform: scale(0.85); background: #b3ffb3; }
      100% { opacity: 1; transform: scale(1.25); background: #f0ffa2; }
    }

    .main-text {
      font-size: 2.15rem;
      font-weight: 800;
      line-height: 1.2;
      margin: 0.8rem 0 1rem;
      background: linear-gradient(120deg, #FDF8E0, #C2F2A4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
      letter-spacing: -0.3px;
    }

    /* HIGHLIGHT GRID — LUXURY DARK PANELS */
    .highlight-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 20px 0 24px;
    }

    .highlight {
      background: rgba(15, 32, 22, 0.85);
      backdrop-filter: blur(4px);
      padding: 1rem 1.2rem;
      border-radius: 1.8rem;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      transition: all 0.2s ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      color: #F2F7E9;
    }

    .highlight i {
      font-size: 1.4rem;
      color: #FFD966;
    }

    .highlight:active {
      background: rgba(212, 175, 55, 0.2);
      transform: scale(0.98);
      border-color: #FFDF8C;
    }

    /* TELEGRAM BUTTON — BOLD GOLD / EMERALD GRADIENT */
    .btn-telegram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(105deg, #1E6B3B, #D4AF37);
      color: #0f1f15;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 1rem 1.2rem;
      border-radius: 80px;
      margin: 0.8rem 0 1rem;
      transition: all 0.25s ease;
      box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.3);
      border: none;
      letter-spacing: 0.5px;
      width: 100%;
      text-align: center;
    }

    .btn-telegram i {
      font-size: 1.55rem;
      transition: transform 0.2s;
      color: #FFECB3;
    }

    .btn-telegram:active {
      transform: scale(0.97);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
      background: linear-gradient(105deg, #D4AF37, #1E6B3B);
    }

    /* ADS SECTION — ELEGANT DARK */
    .ads {
      font-size: 0.75rem;
      color: #D3E6CA;
      background: rgba(0, 0, 0, 0.45);
      padding: 0.7rem 1rem;
      border-radius: 2rem;
      margin-top: 0.8rem;
      text-align: center;
      backdrop-filter: blur(4px);
      border: 0.5px solid rgba(212, 175, 55, 0.4);
    }

    .ads a {
      color: #FFE484;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .ads a:active {
      color: #fff2bb;
      text-shadow: 0 0 3px #ffd966;
    }

    .footer {
      font-size: 0.72rem;
      color: #C0E0B5;
      line-height: 1.45;
      margin-top: 1.5rem;
      border-top: 1px dashed rgba(212, 175, 55, 0.6);
      padding-top: 1.2rem;
      text-align: center;
    }

    /* FULLY RESPONSIVE — REFINED SCALING */
    @media (max-width: 560px) {
      .container {
        padding: 1.4rem 1.2rem 1.8rem;
        margin: 0.8rem;
        width: calc(100% - 1.6rem);
        border-radius: 2rem;
      }
      .main-text {
        font-size: 1.75rem;
      }
      .btn-telegram {
        font-size: 1.05rem;
        padding: 0.85rem 1rem;
      }
      .highlight {
        padding: 0.85rem 1rem;
        font-size: 0.92rem;
      }
      h1 {
        font-size: 2rem;
      }
      .logo-ring-container {
        width: 125px;
        height: 125px;
      }
      .logo {
        width: 110px;
        height: 110px;
      }
      .ring-1 { width: 125px; height: 125px; }
      .ring-2 { width: 145px; height: 145px; }
      .ring-3 { width: 165px; height: 165px; }
      .ring-4 { width: 185px; height: 185px; }
      .ring-5 { width: 205px; height: 205px; }
    }

    @media (max-width: 400px) {
      .container {
        padding: 1.2rem 1rem;
        border-radius: 1.8rem;
      }
      .main-text {
        font-size: 1.55rem;
      }
      .logo-ring-container {
        width: 105px;
        height: 105px;
      }
      .logo {
        width: 92px;
        height: 92px;
      }
      .ring-1 { width: 105px; height: 105px; }
      .ring-2 { width: 122px; height: 122px; }
      .ring-3 { width: 139px; height: 139px; }
      .ring-4 { width: 156px; height: 156px; }
      .ring-5 { width: 173px; height: 173px; }
      .tag {
        font-size: 0.68rem;
        padding: 0.4rem 1rem;
      }
      .btn-telegram {
        font-size: 1rem;
        gap: 8px;
      }
      .highlight i {
        font-size: 1.2rem;
      }
    }

    .btn-telegram, .highlight, .ads a, .tag {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    img {
      display: block;
      max-width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div style="text-align: center;">
    <h1>Jai Club</h1>
  </div>

  <!-- LOGO WITH DYNAMIC PULSE RINGS (EMERALD / GOLD STYLE) -->
  <div class="logo-live-wrapper">
    <div class="logo-ring-container">
      <div class="pulse-ring ring-1"></div>

  </div>

  <!-- TELEGRAM LINK — UNCHANGED, BUT STYLE TRANSFORMED -->
  <a href="https://t.me/+bcU6H9g_QPU5ZTM1" class="btn-telegram" target="_blank" rel="noopener noreferrer">

  </a>

  <div class="ads">
    Ads Setup by @AmitAdsAgency <br>
    <a href="https://t.me/Amit_K_Loot" target="_blank" rel="noopener noreferrer">t.me/Amit_K_Loot</a>
  </div>

  <div class="footer">
    Premium tips & exclusive insights — directly to your Telegram.  
    Join thousands of users and explore data-driven signals.
  </div>
</div>

<script>
  (function() {
    const container = document.querySelector('.container');
    if(container) {
      document.addEventListener('mousemove', function(e) {
        const rect = container.getBoundingClientRect();
        // calculate relative position for radial glow (emerald shimmer)
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        container.style.setProperty('--x-pos', `${x}%`);
        container.style.setProperty('--y-pos', `${y}%`);
      });
    }
  })();
</script>

</body>
</html>
